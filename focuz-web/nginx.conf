server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # The pdf.js worker is an .mjs module; with nosniff, browsers refuse it unless it is served as JavaScript.
  include /etc/nginx/mime.types;
  types { text/javascript mjs; }

  # Only /assets/ (hashed file names) may be cached for good. index.html, sw.js, registerSW.js and
  # the manifest must always be revalidated, or browsers keep serving an old build after a deploy.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    expires 1y;
    add_header Cache-Control "public, immutable" always;
  }
}
