services:
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-focuz_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
      - POSTGRES_DB=${POSTGRES_DB:-focuz_db}
    volumes:
      - db-data:/var/lib/postgresql/data
    # Localhost only: the API reaches the DB over the compose network. Exposing Postgres with the
    # default password to the LAN/internet is an easy way to lose all notes.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-focuz_user} -d ${POSTGRES_DB:-focuz_db}"]
      interval: 2s
      timeout: 5s
      retries: 10
    networks:
      - focuz-network

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    ports:
      # 9000 (S3 API) stays reachable for presigned URLs from older clients; the web app now
      # downloads files through the API. The admin console is localhost only.
      - "9000:9000"
      - "127.0.0.1:9001:9001"
    networks:
      - focuz-network

  api:
    build:
      context: ./focuz-api
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-focuz_user}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-focuz_db}?sslmode=${DB_SSLMODE:-disable}
      # Empty: the API generates a random secret on first start and keeps it in the database
      - JWT_SECRET=${JWT_SECRET:-}
      - APP_ENV=${APP_ENV:-production}
      # Only the address of your reverse proxy, if any. Clients can spoof X-Forwarded-For from any
      # address trusted here, so the default trusts loopback only.
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:8081,http://127.0.0.1:8081,http://localhost:8082,http://127.0.0.1:8082,http://localhost:5173,http://127.0.0.1:5173}
      - ALLOW_CREDENTIALS=${ALLOW_CREDENTIALS:-false}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_EXTERNAL_ENDPOINT=${MINIO_EXTERNAL_ENDPOINT:-http://localhost:9000}
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_BUCKET=notes
      - MINIO_USE_SSL=${MINIO_USE_SSL:-false}
      # Accounts: username (default) or email (sign-up with e-mail + confirmation code)
      - AUTH_MODE=${AUTH_MODE:-username}
      - REGISTRATION=${REGISTRATION:-open}
      # Address users reach the API at; used for the confirmation link in e-mails
      - PUBLIC_API_URL=${PUBLIC_API_URL:-}
      - PUBLIC_WEB_URL=${PUBLIC_WEB_URL:-}
      # Outgoing mail. Without SMTP_HOST, e-mails are only written to the API log.
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURITY=${SMTP_SECURITY:-starttls}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      # Rate limit toggles for dev
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-1}
      - RATE_LIMIT_RPS=${RATE_LIMIT_RPS:-5}
      - RATE_LIMIT_BURST=${RATE_LIMIT_BURST:-20}
      # Never list the Docker network or other ranges all incoming traffic may come from
      - RATE_LIMIT_WHITELIST=${RATE_LIMIT_WHITELIST:-}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    ports:
      - "8080:8080"
    networks:
      - focuz-network

  swagger-ui:
    image: swaggerapi/swagger-ui
    ports:
      - "8082:8080"
    environment:
      SWAGGER_JSON: /foo/openapi.yaml
    volumes:
      - ./focuz-api/openapi.yaml:/foo/openapi.yaml
    networks:
      - focuz-network
    profiles: ["dev"]


  web:
    build:
      context: ./focuz-web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
        VITE_APP_ENV: ${APP_ENV:-production}
        VITE_SYNC_INTERVAL_MS: ${VITE_SYNC_INTERVAL_MS:-60000}
        VITE_SYNC_DEBOUNCE_MS: ${VITE_SYNC_DEBOUNCE_MS:-2000}
        VITE_SYNC_WS_COOLDOWN_MS: ${VITE_SYNC_WS_COOLDOWN_MS:-3000}
        VITE_SYNC_BACKOFF_MS: ${VITE_SYNC_BACKOFF_MS:-15000}
        # false: the sign-in screen has no "Change server" (the app only talks to VITE_API_BASE_URL)
        VITE_ALLOW_CUSTOM_SERVER: ${VITE_ALLOW_CUSTOM_SERVER:-true}
    ports:
      - "8081:80"
    depends_on:
      api:
        condition: service_started
    networks:
      - focuz-network


networks:
  focuz-network:
    driver: bridge

volumes:
  db-data:
  minio-data: 